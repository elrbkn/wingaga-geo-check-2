name: Daily Geo Registration Check

on:
  schedule:
    - cron: '43 6 * * *'   # 9:43
    - cron: '57 13 * * *'  # 16:57
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js (используйте вашу версию)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # 4. Устанавливаем браузеры для Patchright/Playwright
      - name: Install browsers with OS dependencies
        run: npx patchright install --with-deps chromium

      # 5. Устанавливаем шрифты
      - name: Install Xvfb and fonts
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-liberation fonts-noto-core

      # 6. Создаём файл .env из секретов GitHub
      - name: Create .env file
        run: |
          echo "SOAX_HOST=${{ secrets.SOAX_HOST }}" >> .env
          echo "SOAX_PORT=${{ secrets.SOAX_PORT }}" >> .env
          echo "SOAX_LOGIN_PREFIX=${{ secrets.SOAX_LOGIN_PREFIX }}" >> .env
          echo "SOAX_LOGIN_SUFFIX=${{ secrets.SOAX_LOGIN_SUFFIX }}" >> .env
          echo "SOAX_PASSWORD=${{ secrets.SOAX_PASSWORD }}" >> .env
          echo "REGISTRATION_URL=${{ secrets.REGISTRATION_URL }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "TELEGRAM_PROXY_URL=${{ secrets.TELEGRAM_PROXY_URL }}" >> .env

      # 7. Запускаем тесты через ваш скрипт run-daily-check.js
      - name: Run tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" node scripts/run-daily-check.js

      # 8. Сохраняем обновлённый список подписчиков Telegram обратно в репозиторий
      - name: Commit updated telegram subscribers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/subscribers.json
          git diff --cached --quiet || git commit -m "chore: update telegram subscribers [skip ci]"
          git pull --rebase origin main
          git push

      # 9. Сохраняем отчёты как артефакты (опционально)
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/